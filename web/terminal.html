<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>SpectraHub — terminal</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="terminal.css">
<script src="terminal.js" defer></script>
</head>
<body class="term-body">
<header class="top">
  <a class="brand" href="/"><svg class="brand-mark" viewBox="2.6 4.4 20 15.2" aria-hidden="true"><path d="M3.4 12 L14.8 5.2 L14.8 18.8 Z"/><rect x="17.2" y="6.6" width="4.6" height="2.2"/><rect x="17.2" y="11.2" width="4.6" height="2.2"/><rect x="17.2" y="15.8" width="4.6" height="2.2"/></svg><b>SpectraHub</b></a>
  <span class="crumb">terminal</span>
</header>

<main class="term-page">
  <section class="win" aria-label="Terminal">
    <div class="win-bar">
      <span class="lights" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="win-title" id="title">terminal</span>
      <span class="win-meta" id="mode" title="Bez pseudoterminala: komendy działają przez potoki, bez interaktywnych programów">bez TTY</span>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab on" role="tab" aria-selected="true"><span class="state" id="state"></span>shell</button>
    </div>
    <div class="screen" id="screen">
      <div id="out" aria-live="polite"></div>
      <div class="cmd" id="cmd">
        <span class="prompt" id="prompt"></span><span class="typed" id="typed"></span>
        <input id="input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Komenda">
      </div>
    </div>
  </section>
</main>
</body>
</html>
