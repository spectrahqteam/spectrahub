<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>SpectraHub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SpectraHub">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
<script src="github.js" defer></script>
</head>
<body>
<div class="app" id="app">

  <aside class="drawer" id="drawer" aria-label="Menu">
    <div class="d-head">
      <a class="brand" href="/" title="Strona startowa"><svg class="brand-mark" viewBox="2.6 4.4 20 15.2" aria-hidden="true"><path d="M3.4 12 L14.8 5.2 L14.8 18.8 Z"/><rect x="17.2" y="6.6" width="4.6" height="2.2"/><rect x="17.2" y="11.2" width="4.6" height="2.2"/><rect x="17.2" y="15.8" width="4.6" height="2.2"/></svg><b>SpectraHub</b></a>
      <button class="ib" id="dClose" type="button" aria-label="Zamknij menu"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <button class="d-new" id="newBtn" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nowa sesja</button>
    <nav class="d-nav" id="dNav">
      <button type="button" data-page="shell"><svg viewBox="0 0 24 24"><path d="m5 7 5 5-5 5M12 17h7"/></svg>Terminal</button>
      <button type="button" data-page="agents"><svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6.3 6.3l2.5 2.5M15.2 15.2l2.5 2.5M6.3 17.7l2.5-2.5M15.2 8.8l2.5-2.5"/></svg>Agenci</button>
      <button type="button" data-page="files"><svg viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3z"/></svg>Pliki</button>
      <button type="button" data-page="github"><svg viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="9" r="2"/><path d="M6 7v10M18 11c0 4-6 3-12 6"/></svg>GitHub</button>
      <button type="button" data-page="servers"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="7" rx="1.5"/><rect x="4" y="13" width="16" height="7" rx="1.5"/><path d="M8 7.5h.01M8 16.5h.01"/></svg>Serwery</button>
      <button type="button" data-page="studio"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg>SpectraStudio</button>
    </nav>
    <div class="d-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg><input id="dSearch" placeholder="szukaj sesji" autocomplete="off" aria-label="Szukaj sesji"></div>
    <div class="d-list" id="dList"></div>
    <div class="d-foot">
      <button type="button" class="me" id="meBtn"><span class="avatar" id="avatar">·</span><span class="me-txt" id="meTxt">niezalogowany</span></button>
      <button type="button" class="ib" id="setBtn" aria-label="Ustawienia"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="bar">
      <button class="ib" id="menuBtn" type="button" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h12M4 17h16"/></svg></button>
      <div class="bar-title"><b id="title">SpectraHub</b><small id="subtitle"></small></div>
      <button class="bar-usage" id="busy" type="button" aria-label="Zużycie i limity" hidden><svg viewBox="0 0 24 24"><path d="M4 18a8 8 0 1 1 16 0"/><path d="m12 18 4-5"/></svg></button>
      <button class="ib" id="moreBtn" type="button" aria-label="Opcje"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
    </header>

    <div class="screen" id="screen">
      <div id="out" aria-live="polite"></div>
      <div class="cmd" id="cmd" hidden>
        <span class="prompt" id="prompt"></span><span class="typed" id="typed"></span>
        <input id="input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Komenda">
      </div>
    </div>

    <footer class="composer" id="composer" hidden>
      <div class="att" id="att" hidden></div>
      <div class="c-box"><textarea id="cInput" rows="1" autocapitalize="sentences" spellcheck="true" enterkeyhint="enter" aria-label="Wiadomość"></textarea></div>
      <div class="c-tools">
        <button class="ib round" id="plusBtn" type="button" aria-label="Dodaj pliki"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="model-chip" id="modelBtn" type="button" aria-label="Agent i model"></button>
        <span class="grow"></span>
        <button class="ib round" id="micBtn" type="button" aria-label="Dyktuj"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button class="send" id="sendBtn" type="button" aria-label="Wyślij" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
    </footer>
  </main>

  <aside class="viewer" id="viewer" hidden aria-label="Podgląd pliku">
    <header class="v-bar">
      <button class="ib" id="vClose" type="button" aria-label="Zamknij"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div class="bar-title"><b id="vName"></b><small id="vMeta"></small></div>
      <button class="ib" id="vShare" type="button" aria-label="Udostępnij"><svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 13v7h14v-7"/></svg></button>
      <button class="ib" id="vDown" type="button" aria-label="Pobierz"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button>
    </header>
    <div class="v-body" id="vBody"></div>
  </aside>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <div class="grab"></div>
    <header class="s-head"><button class="ib" id="sBack" type="button" aria-label="Wstecz" hidden><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><button class="ib" id="sClose" type="button" aria-label="Zamknij"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><b id="sTitle"></b><span class="ib-gap"></span></header>
    <div class="s-body" id="sBody"></div>
  </div>
</div>

<input type="file" id="pickFiles" multiple hidden>
<input type="file" id="pickPhotos" accept="image/*,video/*" multiple hidden>
<input type="file" id="pickCamera" accept="image/*" capture="environment" hidden>
</body>
</html>
