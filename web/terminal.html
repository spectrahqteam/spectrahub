<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>SpectraHub — terminal</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="terminal.css">
<script src="terminal.js" defer></script>
</head>
<body class="term-body">
<header class="top">
  <a class="brand" href="/"><svg class="brand-mark" viewBox="2.6 4.4 20 15.2" aria-hidden="true"><path d="M3.4 12 L14.8 5.2 L14.8 18.8 Z"/><rect x="17.2" y="6.6" width="4.6" height="2.2"/><rect x="17.2" y="11.2" width="4.6" height="2.2"/><rect x="17.2" y="15.8" width="4.6" height="2.2"/></svg><b>SpectraHub</b></a>
  <span class="crumb">terminal</span>
</header>

<main class="term-page">
  <section class="win" aria-label="Terminal">
    <div class="win-bar">
      <span class="lights" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="win-title" id="title">terminal</span>
      <span class="win-meta" id="mode" title="Bez pseudoterminala: komendy działają przez potoki, bez interaktywnych programów">bez TTY</span>
      <button class="gear" id="gear" type="button" aria-label="Ustawienia" title="Ustawienia"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
    </div>
    <div class="settings" id="settings" hidden>
      <div class="s-head"><b>ustawienia</b><button type="button" id="s-close" aria-label="Zamknij">×</button></div>
      <div class="s-row">
        <span class="s-label">token tego urządzenia</span>
        <code id="s-token">—</code>
        <span class="s-btns"><button type="button" id="s-show">pokaż</button><button type="button" id="s-copy">kopiuj</button></span>
      </div>
      <div class="s-row">
        <span class="s-label">zaloguj inne urządzenie</span>
        <span class="s-note">link z tokenem: otwórz go raz na drugim urządzeniu. Traktuj jak hasło.</span>
        <span class="s-btns"><button type="button" id="s-link">kopiuj link</button></span>
      </div>
      <div class="s-row">
        <span class="s-label">nowy token</span>
        <span class="s-note">na serwerze: <code>spectrahub token --rotate</code> — wszystkie urządzenia zalogują się ponownie</span>
      </div>
      <div class="s-row"><span class="s-btns"><button type="button" id="s-logout" class="warn">wyloguj to urządzenie</button></span></div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab on" role="tab" aria-selected="true"><span class="state" id="state"></span>shell</button>
    </div>
    <div class="screen" id="screen">
      <div id="out" aria-live="polite"></div>
      <div class="cmd" id="cmd">
        <span class="prompt" id="prompt"></span><span class="typed" id="typed"></span>
        <input id="input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Komenda">
      </div>
    </div>
  </section>
</main>
</body>
</html>
