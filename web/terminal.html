<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>SpectraHub — warsztat</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="workspace.css">
<script src="workspace.js" defer></script>
</head>
<body class="ws">
<header class="top">
  <a class="brand" href="/"><svg class="brand-mark" viewBox="2.6 4.4 20 15.2" aria-hidden="true"><path d="M3.4 12 L14.8 5.2 L14.8 18.8 Z"/><rect x="17.2" y="6.6" width="4.6" height="2.2"/><rect x="17.2" y="11.2" width="4.6" height="2.2"/><rect x="17.2" y="15.8" width="4.6" height="2.2"/></svg><b>SpectraHub</b></a>
  <span class="crumb" id="crumb">warsztat</span>
  <span class="top-meta" id="topMeta"></span>
</header>

<div class="ws-grid" id="grid">
  <nav class="rail" aria-label="Menu">
    <button class="r-btn" data-panel="sessions" title="Sesje" aria-label="Sesje"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
    <button class="r-btn" data-panel="terminal" title="Terminal" aria-label="Terminal"><svg viewBox="0 0 24 24"><path d="m5 7 5 5-5 5M12 17h7"/></svg></button>
    <button class="r-btn" data-panel="agents" title="Agenci" aria-label="Agenci"><svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6.3 6.3l2.5 2.5M15.2 15.2l2.5 2.5M6.3 17.7l2.5-2.5M15.2 8.8l2.5-2.5"/></svg></button>
    <button class="r-btn" data-panel="files" title="Pliki" aria-label="Pliki"><svg viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3z"/></svg></button>
    <button class="r-btn" data-panel="github" title="GitHub" aria-label="GitHub"><svg viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="9" r="2"/><path d="M6 7v10M18 11c0 4-6 3-12 6"/></svg></button>
    <button class="r-btn" data-panel="servers" title="Serwery" aria-label="Serwery"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="7" rx="1.5"/><rect x="4" y="13" width="16" height="7" rx="1.5"/><path d="M8 7.5h.01M8 16.5h.01"/></svg></button>
    <button class="r-btn" data-panel="studio" title="SpectraStudio" aria-label="SpectraStudio"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg></button>
    <span class="r-gap"></span>
    <button class="r-btn" data-panel="settings" title="Ustawienia" aria-label="Ustawienia"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
  </nav>

  <aside class="panel" id="panel" aria-label="Panel">
    <div class="p-head"><b id="pTitle"></b><button class="p-close" id="pClose" type="button" aria-label="Zamknij panel">×</button></div>
    <div class="p-body" id="pBody"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="stage">
    <section class="win" aria-label="Okno">
      <div class="win-bar">
        <span class="lights" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="win-title" id="title">terminal</span>
        <span class="win-meta" id="mode"></span>
      </div>
      <div class="screen" id="screen">
        <div id="out" aria-live="polite"></div>
        <div class="cmd" id="cmd">
          <span class="prompt" id="prompt"></span><span class="typed" id="typed"></span>
          <input id="input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Komenda">
        </div>
      </div>
      <div class="composer" id="composer" hidden>
        <div class="c-line">
          <span class="c-prompt" id="cPrompt"></span>
          <textarea id="cInput" rows="1" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-label="Wiadomość" placeholder="wiadomość albo @agent…"></textarea>
          <button class="c-send" id="cSend" type="button" aria-label="Wyślij"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
        </div>
        <div class="hints" id="hints"></div>
      </div>
    </section>
  </main>
</div>

<footer class="status" id="status"></footer>

<dialog class="dlg" id="startDlg">
  <form method="dialog" id="startForm">
    <div class="dlg-head"><span class="lights" aria-hidden="true"><i></i><i></i><i></i></span><b>start sesja</b></div>
    <p class="dlg-note">Wybierz agentów. Każdy dostaje nową sesję i pracujecie razem w jednym oknie. Nazwa sesji powstanie z pierwszej wiadomości.</p>
    <div class="pick" id="pick"></div>
    <div class="dlg-btns"><button value="cancel" type="submit" class="ghost">anuluj</button><button value="start" type="submit" class="go" id="startGo">start</button></div>
  </form>
</dialog>
</body>
</html>
